name: Verifiche v2
on:
  push:
    branches: [sviluppo-v2]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: echo AUTH_WEB_API_KEY=demo-key > functions/.env.local
      - run: pnpm test
      - run: pnpm exec firebase emulators:exec --non-interactive --project demo-combriccola --only firestore,storage 'node --test tests/rules.test.js tests/migration.test.js'
      - run: pnpm test:integration
      - run: pnpm build
